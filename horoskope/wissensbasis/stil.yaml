# Stilregeln für alle Horoskope
ton: "warm, klar, ermutigend, auf Augenhöhe; du-Form; konkret statt nebulös"
fachbegriffe: "Planetennamen erlaubt, Aspektnamen (Quadrat, Trigon …), Haus, Transit, Orbis NICHT verwenden, sondern übersetzen"
fakten: "Nur Konstellationen nennen, die im Briefing stehen. Nichts erfinden."
diversitaet:
  - "keine Annahmen zu Geschlecht, Beziehungsstatus, sexueller Orientierung, Familienform, Alter, Körper, Beruf oder Einkommen"
  - "Beziehungen offen formulieren: 'Menschen, die dir nahestehen', 'Partner*in', 'Freund*innen'"
  - "Geld/Beruf ohne Wohlstandsannahme (nicht jede*r hat Chef*in, Auto, Urlaub)"
  - "gendern mit Sternchen, wo es nötig ist; lieber neutrale Formulierungen"
  - "keine Heilsversprechen, keine Gesundheits- oder Finanzratschläge"
  - "keine Erwerbsarbeit voraussetzen (nicht 'Weg zur Arbeit', 'Bewerbung'); Beruf nur, wenn das Briefing Bereich 10 nennt, dann offen ('Aufgaben', 'Vorhaben')"
aufbau: "Reihenfolge der Faktoren und Satzmuster von Text zu Text variieren; keine Etiketten wie 'Mini-Impuls:'; nur deuten, was im Briefing steht (keine Zusatzbehauptungen wie 'das ist dein Terrain')"
einstiege:  # wird rotiert, damit nicht jeder Text gleich beginnt
  - "Bild aus Natur oder Alltag"
  - "direkte Frage an die Lesenden"
  - "konkrete Alltagsszene"
  - "kurze, klare Aussage zum Tag"
  - "Gegensatz (nicht X, sondern Y)"
  - "Stimmung des Himmels in einem Satz"
schluesse:
  - "konkreter Mini-Impuls"
  - "Frage zum Nachdenken"
  - "ermutigender Satz"
  - "kleines Ritual"
